# Phase 1 Tier A — frozen feasibility config (~1M tokens).
# Base: jetmoe/jetmoe-8b downloaded on Kaggle (see notebook). Local dev uses models/jetmoe-8b/.
# Variants trained: model_adaptive, block_adaptive, layer_adaptive (base code kept, run skipped).
# Data: high-quality + reasoning-heavy mix. All public, no HF token needed for download.

model:
  name: jetmoe-8b
  hf_id: jetmoe/jetmoe-8b
  path: /kaggle/working/jetmoe-8b
  tokenizer_path: /kaggle/working/jetmoe-8b
  block_size: 4
  device_map: auto

arc:
  seed: 0
  max_loops: 4
  variants:
    - model_adaptive
    - block_adaptive
    - layer_adaptive
  depth_dist: {1: 0.4, 2: 0.3, 3: 0.2, 4: 0.1}

cpt:
  method: qlora
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    targets: [kv_proj]
  lr: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  seq_len: 1024
  effective_batch: 16
  micro_batch: 1
  gradient_checkpointing: true
  tier_a_tokens: 1000000
  tier_b_tokens: 50000000
  log_every: 5
  eval_every: 20
  checkpoint_every: 30
  per_loop_loss_every: 20
  output_dir: /kaggle/working/checkpoints/phase1-tier-a

data:
  datasets:
    - {name: HuggingFaceFW/fineweb-edu, config: sample-10BT, weight: 0.5, split: train}
    - {name: HuggingFaceTB/cosmopedia, config: auto_math_text, weight: 0.2, split: train}
    - {name: HuggingFaceTB/cosmopedia, config: khanacademy, weight: 0.1, split: train}
    - {name: open-web-math/open-web-math, weight: 0.1, split: train}
    - {name: Salesforce/wikitext, config: wikitext-103-raw-v1, weight: 0.1, split: train}
  val_datasets:
    - {name: Salesforce/wikitext, config: wikitext-103-raw-v1, split: validation}
  val_batches: 8
  synthetic: false

eval:
  arc_easy_probe: false

hub:
  repo_id: Nyvo/arc-jetmoe-recurrence-phase1
  push_best: true
