[project]
name = "arc-adaptive-recurrence-computing"
version = "0.1.0"
description = "Adaptive Recurrence Computing for pretrained MoE Transformers"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.42.0,<5",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lmeval = ["lm-eval[hf]>=0.4.12"]

[project.scripts]
arc-lm-eval = "arc.lmeval:cli"
arc-benchmark = "arc.benchmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
