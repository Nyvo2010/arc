[project]
name = "arc-adaptive-recurrence-computing"
version = "0.1.0"
description = "Adaptive Recurrence Computing for pretrained MoE Transformers"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.5.0",
    "numpy<2",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "peft>=0.10.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
