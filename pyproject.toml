[project]
name = "arc-adaptive-recurrence-computing"
version = "0.1.0"
description = "Adaptive Recurrence Computing for pretrained MoE Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate",
    "datasets",
    "scikit-learn",
    "numpy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
